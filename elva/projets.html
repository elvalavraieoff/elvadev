<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projets — ELVA</title>
  <meta name="description" content="Bots et outils Discord créés par ELVA, développeuse française.">
  <meta name="theme-color" content="#151417">
  <link rel="icon" type="assets/doodles" href="img/star.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/projets.css">
  <!-- Micro-script : applique le thème enregistré avant l'affichage (évite un flash) -->
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("elva-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="page-projects">
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html" aria-label="ELVA, retour à l'accueil">ELVA <img src="assets/doodles/star.svg" alt="" width="20" height="20"></a>
      <nav class="nav" aria-label="Navigation principale">
        <div class="nav__links" id="menu">
        <a href="index.html">Accueil</a>
        <a href="projets.html" aria-current="page">Projets</a>
        <a href="a-propos.html">À propos</a>
        <a href="competences.html">Compétences</a>
        <a href="contact.html">Contact</a>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème (sombre / clair)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
        <button class="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Ouvrir le menu"><span></span></button>
      </nav>
    </div>
  </header>

  <main id="contenu">

    <header class="page-head wrap">
      <h1 class="display reveal">Projets</h1>
      <p class="lead reveal" data-delay="1">Des bots et des outils Discord, classés comme dans un carnet.</p>
      <p class="note page-head__note hide-sm">à feuilleter !</p>
      <img class="doodle doodle--ink doodle--wide page-head__arrow hide-sm" src="assets/doodles/arrow.svg" alt="" aria-hidden="true" width="120" height="90">
    </header>

    <section class="wrap" aria-label="Liste des projets">
      <!-- Généré par js/projects.js à partir du tableau "projects" -->
      <ol class="project-list" data-projects-list></ol>
      <noscript><p class="lead">Activez JavaScript pour afficher la liste des projets.</p></noscript>
    </section>

    <section class="wrap projects-end reveal">
      <p class="hand projects-end__text">Un projet en tête ?</p>
      <a class="btn btn--paper" href="contact.html">Discutons-en →</a>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <!-- Rempli par js/visits.js (compteur réel, jamais un faux chiffre) -->
      <p class="visit-counter" data-visit-counter aria-live="polite" hidden></p>
      <small>© <span data-year>2026</span> ELVA — Développeuse bots &amp; serveurs Discord</small>
    </div>
  </footer>

  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/visits.js" defer></script>
  <script src="js/projects.js" defer></script>
</body>
</html>
